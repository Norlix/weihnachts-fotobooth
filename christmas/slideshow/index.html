<!doctype html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IBM Muccenter Christmas Fotobooth Diashow</title>
    <link rel="stylesheet" href="slideshow.css">
</head>
<body>
<main id="stage">

    <canvas id="snow"></canvas>
    <img id="garland" src="../ui/assets/garland.svg" alt="">
    <footer id="ribbon"><span><strong>IBM</strong> Muccenter <span class="gold">Christmas</span> Fotobooth</span><span id="count"></span></footer>
    <div id="progress"></div>
    <div id="state"></div>
</main>
<script src="slideshow.js"></script>
</body>
</html>
